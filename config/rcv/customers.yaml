table_name: customers
schema_name: retail

rcv_layer: rcv
l0_layer: l0
quarantine_layer: quarantine

rcv_format: csv
l0_format: csv
quarantine_format: csv

columns:
  - name: id
    type: string
  - name: name
    type: string
  - name: birthday
    type: date
    format: YYYY-MM-DD
  - name: address
    type: string
  - name: kpi
    type: decimal

validation:
  validate_file: true
  validate_schema: true
